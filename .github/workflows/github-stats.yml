name: Update GitHub Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats
        uses: actions/github-script@v9
        with:
          script: |
            const username = "AnushkaBanik";

            /*
             * ============================================================
             * 1. CONTRIBUTION DATA — LAST 12 MONTHS
             * ============================================================
             */

            const contributionQuery = `
              query(
                $login: String!
                $from: DateTime!
                $to: DateTime!
              ) {
                user(login: $login) {
                  createdAt

                  contributionsCollection(
                    from: $from
                    to: $to
                  ) {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions

                    contributionCalendar {
                      totalContributions

                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const now = new Date();

            const oneYearAgo = new Date(now);
            oneYearAgo.setUTCFullYear(
              oneYearAgo.getUTCFullYear() - 1
            );

            const contributionResult =
              await github.graphql(
                contributionQuery,
                {
                  login: username,
                  from: oneYearAgo.toISOString(),
                  to: now.toISOString()
                }
              );

            const user = contributionResult.user;

            const contributions =
              user.contributionsCollection;

            const calendar =
              contributions.contributionCalendar;

            /*
             * Flatten contribution days.
             */

            const recentDays = calendar.weeks
              .flatMap(
                week => week.contributionDays
              )
              .sort(
                (a, b) =>
                  a.date.localeCompare(b.date)
              );

            /*
             * ============================================================
             * 2. CONTRIBUTION STATISTICS
             * ============================================================
             */

            const totalContributions =
              calendar.totalContributions;

            const commitContributions =
              contributions.totalCommitContributions;

            const pullRequests =
              contributions.totalPullRequestContributions;

            const issues =
              contributions.totalIssueContributions;

            /*
             * ============================================================
             * 3. CURRENT STREAK
             *
             * Correct behavior:
             *
             * - If today has contributions:
             *   start from today.
             *
             * - If today has zero contributions:
             *   start from yesterday.
             *
             * - If yesterday is also zero:
             *   streak = 0.
             * ============================================================
             */

            const dayMap = new Map();

            for (const day of recentDays) {
              dayMap.set(
                day.date,
                day.contributionCount
              );
            }

            const formatDate = date =>
              date.toISOString().slice(0, 10);

            const today =
              formatDate(new Date());

            const yesterdayDate =
              new Date();

            yesterdayDate.setUTCDate(
              yesterdayDate.getUTCDate() - 1
            );

            const yesterday =
              formatDate(yesterdayDate);

            let currentStreak = 0;

            let streakStartDate = null;

            if ((dayMap.get(today) || 0) > 0) {
              streakStartDate = today;
            } else if (
              (dayMap.get(yesterday) || 0) > 0
            ) {
              streakStartDate = yesterday;
            }

            if (streakStartDate) {
              let cursor =
                new Date(
                  `${streakStartDate}T00:00:00Z`
                );

              while (true) {
                const dateString =
                  formatDate(cursor);

                if (
                  (dayMap.get(dateString) || 0) <= 0
                ) {
                  break;
                }

                currentStreak++;

                cursor.setUTCDate(
                  cursor.getUTCDate() - 1
                );
              }
            }

            /*
             * ============================================================
             * 4. HISTORICAL LONGEST STREAK
             *
             * GitHub contribution ranges are limited to one year.
             * Therefore we query each year separately and combine all
             * contribution days.
             * ============================================================
             */

            const createdYear =
              new Date(user.createdAt)
                .getUTCFullYear();

            const currentYear =
              now.getUTCFullYear();

            const historicalDays = new Map();

            const yearlyContributionQuery = `
              query(
                $login: String!
                $from: DateTime!
                $to: DateTime!
              ) {
                user(login: $login) {
                  contributionsCollection(
                    from: $from
                    to: $to
                  ) {
                    contributionCalendar {
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            for (
              let year = createdYear;
              year <= currentYear;
              year++
            ) {
              const yearStart =
                new Date(
                  `${year}-01-01T00:00:00Z`
                );

              const yearEnd =
                year === currentYear
                  ? now
                  : new Date(
                      `${year + 1}-01-01T00:00:00Z`
                    );

              const yearlyResult =
                await github.graphql(
                  yearlyContributionQuery,
                  {
                    login: username,
                    from: yearStart.toISOString(),
                    to: yearEnd.toISOString()
                  }
                );

              const yearlyDays =
                yearlyResult.user
                  .contributionsCollection
                  .contributionCalendar
                  .weeks
                  .flatMap(
                    week =>
                      week.contributionDays
                  );

              for (const day of yearlyDays) {
                historicalDays.set(
                  day.date,
                  day.contributionCount
                );
              }
            }

            const historicalDates =
              Array.from(
                historicalDays.keys()
              ).sort();

            let longestStreak = 0;
            let runningStreak = 0;
            let previousDate = null;

            for (const date of historicalDates) {
              const count =
                historicalDays.get(date);

              if (count > 0) {
                if (previousDate) {
                  const previous =
                    new Date(
                      `${previousDate}T00:00:00Z`
                    );

                  const current =
                    new Date(
                      `${date}T00:00:00Z`
                    );

                  const difference =
                    Math.round(
                      (
                        current - previous
                      ) /
                      (1000 * 60 * 60 * 24)
                    );

                  if (difference === 1) {
                    runningStreak++;
                  } else {
                    runningStreak = 1;
                  }
                } else {
                  runningStreak = 1;
                }

                longestStreak =
                  Math.max(
                    longestStreak,
                    runningStreak
                  );

                previousDate = date;
              } else {
                runningStreak = 0;
                previousDate = null;
              }
            }

            /*
             * ============================================================
             * 5. PUBLIC REPOSITORIES
             *
             * REST pagination means repositories beyond #100 are included.
             * ============================================================
             */

            const repositories =
              await github.paginate(
                github.rest.repos.listForUser,
                {
                  username,
                  type: "owner",
                  per_page: 100
                }
              );

            const publicRepositories =
              repositories.filter(
                repo =>
                  repo.visibility === "public" &&
                  !repo.fork
              );

            const repositoryCount =
              publicRepositories.length;

            /*
             * ============================================================
             * 6. STARS + FORKS
             * ============================================================
             */

            const starsReceived =
              publicRepositories.reduce(
                (total, repo) =>
                  total +
                  (repo.stargazers_count || 0),
                0
              );

            const forkedRepositories =
            publicRepositories.filter(
               repo => repo.fork === true
             ).length;

            const forksReceived =
              publicRepositories.reduce(
                (total, repo) =>
                  total +
                  (repo.forks_count || 0),
                0
              );

            /*
             * ============================================================
             * 7. LANGUAGE STATISTICS
             *
             * GitHub REST returns the byte count for every language
             * detected in each repository.
             * ============================================================
             */

            const languageSizes = {};

            for (
              const repo of publicRepositories
            ) {
              try {
                const response =
                  await github.rest.repos.listLanguages(
                    {
                      owner: username,
                      repo: repo.name
                    }
                  );

                const languages =
                  response.data;

                for (
                  const [language, size]
                  of Object.entries(languages)
                ) {
                  languageSizes[language] =
                    (
                      languageSizes[language] || 0
                    ) + size;
                }
              } catch (error) {
                console.log(
                  `Could not read languages for ${repo.name}`
                );
              }
            }

            const totalLanguageSize =
              Object.values(languageSizes)
                .reduce(
                  (sum, value) =>
                    sum + value,
                  0
                );

            const languages =
              Object.entries(languageSizes)
                .map(
                  ([name, size]) => ({
                    name,
                    percentage:
                      totalLanguageSize > 0
                        ? (
                            size /
                            totalLanguageSize
                          ) * 100
                        : 0
                  })
                )
                .sort(
                  (a, b) =>
                    b.percentage -
                    a.percentage
                )
                .slice(0, 5);

            /*
             * ============================================================
             * 8. XML ESCAPING
             * ============================================================
             */

            const escapeXml = value =>
              String(value)
                .replace(
                  /&/g,
                  "&amp;"
                )
                .replace(
                  /</g,
                  "&lt;"
                )
                .replace(
                  />/g,
                  "&gt;"
                )
                .replace(
                  /"/g,
                  "&quot;"
                )
                .replace(
                  /'/g,
                  "&apos;"
                );

            /*
             * ============================================================
             * 9. LANGUAGE ROWS
             * ============================================================
             */

            const languageRows =
              languages.length > 0
                ? languages
                    .map(
                      (
                        language,
                        index
                      ) => {
                        const y =
                          400 +
                          index * 32;

                        const percentage =
                          language.percentage
                            .toFixed(1);

                        const barWidth =
                          Math.max(
                            8,
                            Math.round(
                              language.percentage *
                              3.2
                            )
                          );

                        return `
                          <text
                            x="55"
                            y="${y}"
                            fill="#c9d1d9"
                            font-family="Arial, sans-serif"
                            font-size="12">
                            ${escapeXml(
                              language.name
                            )}
                          </text>

                          <rect
                            x="170"
                            y="${y - 11}"
                            width="185"
                            height="9"
                            rx="4.5"
                            fill="#21262d"/>

                          <rect
                            x="170"
                            y="${y - 11}"
                            width="${Math.min(
                              barWidth,
                              185
                            )}"
                            height="9"
                            rx="4.5"
                            fill="#58a6ff"/>

                          <text
                            x="375"
                            y="${y}"
                            fill="#8b949e"
                            font-family="Arial, sans-serif"
                            font-size="12">
                            ${percentage}%
                          </text>
                        `;
                      }
                    )
                    .join("")
                : `
                    <text
                      x="55"
                      y="400"
                      fill="#8b949e"
                      font-family="Arial, sans-serif"
                      font-size="12">
                      No language data available
                    </text>
                  `;

            /*
             * ============================================================
             * 10. PROFESSIONAL SVG
             * ============================================================
             */

            const svg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="760"
              height="570"
              viewBox="0 0 760 570">

              <!-- Background -->

              <rect
                width="760"
                height="570"
                rx="18"
                fill="#0d1117"/>

              <rect
                x="1"
                y="1"
                width="758"
                height="568"
                rx="18"
                fill="none"
                stroke="#30363d"/>

              <!-- Header -->

              <text
                x="36"
                y="48"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="23"
                font-weight="700">
                GitHub Analysis
              </text>

              <text
                x="36"
                y="72"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="12">
                AnushkaBanik
              </text>

              <circle
                cx="128"
                cy="68"
                r="2"
                fill="#58a6ff"/>

              <text
                x="138"
                y="72"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="12">
                Updated automatically
              </text>

              <line
                x1="36"
                y1="94"
                x2="724"
                y2="94"
                stroke="#30363d"/>

              <!-- Primary metrics -->

              <text
                x="126"
                y="123"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                CONTRIBUTIONS
              </text>

              <text
                x="126"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="31"
                font-weight="700">
                ${totalContributions}
              </text>

              <text
                x="126"
                y="176"
                text-anchor="middle"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                LAST 12 MONTHS
              </text>


              <text
                x="380"
                y="123"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                CURRENT STREAK
              </text>

              <text
                x="380"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="31"
                font-weight="700">
                ${currentStreak}
              </text>

              <text
                x="380"
                y="176"
                text-anchor="middle"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                CONSECUTIVE DAYS
              </text>


              <text
                x="634"
                y="123"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                LONGEST STREAK
              </text>

              <text
                x="634"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="31"
                font-weight="700">
                ${longestStreak}
              </text>

              <text
                x="634"
                y="176"
                text-anchor="middle"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                ALL TIME
              </text>

              <line
                x1="36"
                y1="198"
                x2="724"
                y2="198"
                stroke="#30363d"/>

              <!-- Activity metrics -->

              <text
                x="126"
                y="228"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                COMMIT CONTRIBUTIONS
              </text>

              <text
                x="126"
                y="257"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${commitContributions}
              </text>


              <text
                x="380"
                y="228"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                PULL REQUESTS
              </text>

              <text
                x="380"
                y="257"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${pullRequests}
              </text>


              <text
                x="634"
                y="228"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                ISSUES
              </text>

              <text
                x="634"
                y="257"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${issues}
              </text>

              <line
                x1="36"
                y1="279"
                x2="724"
                y2="279"
                stroke="#30363d"/>

              <!-- Repository metrics -->

              <text
                x="190"
                y="309"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                PUBLIC REPOSITORIES
              </text>

              <text
                x="190"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="21"
                font-weight="700">
                ${repositoryCount}
              </text>


              <text
                x="380"
                y="309"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                STARS
              </text>

              <text
                x="380"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="21"
                font-weight="700">
                ${stars}
              </text>


              <text
                x="570"
                y="309"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="10"
                font-weight="600">
                FORKS
              </text>

              <text
                x="570"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="21"
                font-weight="700">
                ${forks}
              </text>

              <line
                x1="36"
                y1="360"
                x2="724"
                y2="360"
                stroke="#30363d"/>

              <!-- Languages -->

              <text
                x="36"
                y="386"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="14"
                font-weight="700">
                Top Languages
              </text>

              <text
                x="724"
                y="386"
                text-anchor="end"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                BY CODE SIZE
              </text>

              ${languageRows}

              <!-- Footer -->

              <text
                x="36"
                y="548"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                Generated automatically by GitHub Actions
              </text>

              <text
                x="724"
                y="548"
                text-anchor="end"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="9">
                github.com/AnushkaBanik
              </text>

            </svg>
            `;

            /*
             * ============================================================
             * 11. WRITE SVG
             * ============================================================
             */

            const path =
              "assets/github-stats.svg";

            let existingSha;

            try {
              const existing =
                await github.rest.repos.getContent(
                  {
                    owner:
                      context.repo.owner,
                    repo:
                      context.repo.repo,
                    path,
                    ref:
                      context.payload
                        .repository
                        .default_branch
                  }
                );

              if (
                !Array.isArray(
                  existing.data
                )
              ) {
                existingSha =
                  existing.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const encoded =
              Buffer.from(
                svg.trim(),
                "utf8"
              ).toString("base64");

            await github.rest
              .repos
              .createOrUpdateFileContents(
                {
                  owner:
                    context.repo.owner,
                  repo:
                    context.repo.repo,
                  path,
                  message:
                    "chore: update GitHub stats",
                  content: encoded,
                  sha: existingSha,
                  branch:
                    context.payload
                      .repository
                      .default_branch
                }
              );

            console.log(
              "GitHub stats updated successfully."
            );

            console.log({
              totalContributions,
              currentStreak,
              longestStreak,
              commitContributions,
              pullRequests,
              issues,
              repositoryCount,
              stars,
              forks,
              languages
            });
