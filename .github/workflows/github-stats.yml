name: Update GitHub Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats
        uses: actions/github-script@v9
        with:
          script: |
            const username = "AnushkaBanik";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  followers {
                    totalCount
                  }

                  contributionsCollection {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions

                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }

                  repositories(
                    first: 100
                    ownerAffiliations: OWNER
                    privacy: PUBLIC
                    isFork: false
                  ) {
                    totalCount

                    nodes {
                      name
                      stargazerCount
                      forkCount

                      languages(
                        first: 10
                        orderBy: {field: SIZE, direction: DESC}
                      ) {
                        edges {
                          size
                          node {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const user = result.user;
            const contributions = user.contributionsCollection;
            const calendar = contributions.contributionCalendar;

            const days = calendar.weeks
              .flatMap(week => week.contributionDays)
              .sort((a, b) => a.date.localeCompare(b.date));

            /*
             * Contribution statistics
             */

            const totalContributions =
              calendar.totalContributions;

            const commitContributions =
              contributions.totalCommitContributions;

            const pullRequests =
              contributions.totalPullRequestContributions;

            const issues =
              contributions.totalIssueContributions;

            const reviews =
              contributions.totalPullRequestReviewContributions;

            /*
             * Current streak
             */

            let currentStreak = 0;

            for (let i = days.length - 1; i >= 0; i--) {
              if (days[i].contributionCount > 0) {
                currentStreak++;
              } else {
                break;
              }
            }

            /*
             * Longest streak
             */

            let longestStreak = 0;
            let runningStreak = 0;

            for (const day of days) {
              if (day.contributionCount > 0) {
                runningStreak++;

                longestStreak = Math.max(
                  longestStreak,
                  runningStreak
                );
              } else {
                runningStreak = 0;
              }
            }

            /*
             * Repository statistics
             */

            const repositories =
              user.repositories.nodes;

            const repositoryCount =
              user.repositories.totalCount;

            const stars = repositories.reduce(
              (total, repo) =>
                total + repo.stargazerCount,
              0
            );

            const forks = repositories.reduce(
              (total, repo) =>
                total + repo.forkCount,
              0
            );

            /*
             * Calculate language usage by repository size.
             */

            const languageSizes = {};

            for (const repo of repositories) {
              for (const edge of repo.languages.edges) {
                const language =
                  edge.node.name;

                languageSizes[language] =
                  (languageSizes[language] || 0) +
                  edge.size;
              }
            }

            const totalLanguageSize =
              Object.values(languageSizes)
                .reduce(
                  (sum, value) => sum + value,
                  0
                );

            const languages =
              Object.entries(languageSizes)
                .map(([name, size]) => ({
                  name,
                  percentage:
                    totalLanguageSize > 0
                      ? (size / totalLanguageSize) * 100
                      : 0
                }))
                .sort(
                  (a, b) =>
                    b.percentage - a.percentage
                )
                .slice(0, 5);

            /*
             * XML escaping
             */

            const escapeXml = (value) =>
              String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");

            /*
             * Language rows
             */

            const languageRows =
              languages.length > 0
                ? languages.map((language, index) => {
                    const y = 395 + index * 34;
                    const percentage =
                      language.percentage.toFixed(1);

                    const barWidth =
                      Math.max(
                        8,
                        Math.round(
                          language.percentage * 3
                        )
                      );

                    return `
                      <text
                        x="55"
                        y="${y}"
                        fill="#c9d1d9"
                        font-family="Arial, sans-serif"
                        font-size="12">
                        ${escapeXml(language.name)}
                      </text>

                      <rect
                        x="170"
                        y="${y - 12}"
                        width="180"
                        height="10"
                        rx="5"
                        fill="#21262d"/>

                      <rect
                        x="170"
                        y="${y - 12}"
                        width="${Math.min(barWidth, 180)}"
                        height="10"
                        rx="5"
                        fill="#58a6ff"/>

                      <text
                        x="370"
                        y="${y}"
                        fill="#8b949e"
                        font-family="Arial, sans-serif"
                        font-size="12">
                        ${percentage}%
                      </text>
                    `;
                  }).join("")
                : `
                    <text
                      x="55"
                      y="395"
                      fill="#8b949e"
                      font-family="Arial, sans-serif"
                      font-size="12">
                      No language data available
                    </text>
                  `;

            /*
             * SVG
             */

            const svg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="700"
              height="600"
              viewBox="0 0 700 600">

              <rect
                width="700"
                height="600"
                rx="14"
                fill="#0d1117"/>

              <rect
                x="1"
                y="1"
                width="698"
                height="598"
                rx="14"
                fill="none"
                stroke="#30363d"/>

              <text
                x="35"
                y="48"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                GitHub Analysis
              </text>

              <text
                x="35"
                y="72"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="12">
                AnushkaBanik · automatically updated
              </text>

              <line
                x1="35"
                y1="92"
                x2="665"
                y2="92"
                stroke="#30363d"/>

              <!-- Top statistics -->

              <text
                x="105"
                y="125"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                TOTAL CONTRIBUTIONS
              </text>

              <text
                x="105"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="30"
                font-weight="700">
                ${totalContributions}
              </text>

              <text
                x="350"
                y="125"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                CURRENT STREAK
              </text>

              <text
                x="350"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="30"
                font-weight="700">
                ${currentStreak}
              </text>

              <text
                x="595"
                y="125"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                LONGEST STREAK
              </text>

              <text
                x="595"
                y="158"
                text-anchor="middle"
                fill="#58a6ff"
                font-family="Arial, sans-serif"
                font-size="30"
                font-weight="700">
                ${longestStreak}
              </text>

              <line
                x1="35"
                y1="185"
                x2="665"
                y2="185"
                stroke="#30363d"/>

              <!-- Activity statistics -->

              <text
                x="105"
                y="220"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                COMMITS
              </text>

              <text
                x="105"
                y="250"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${commitContributions}
              </text>

              <text
                x="350"
                y="220"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                PULL REQUESTS
              </text>

              <text
                x="350"
                y="250"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${pullRequests}
              </text>

              <text
                x="595"
                y="220"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                ISSUES
              </text>

              <text
                x="595"
                y="250"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="22"
                font-weight="700">
                ${issues}
              </text>

              <line
                x1="35"
                y1="275"
                x2="665"
                y2="275"
                stroke="#30363d"/>

              <!-- Repository statistics -->

              <text
                x="175"
                y="310"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                PUBLIC REPOSITORIES
              </text>

              <text
                x="175"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="700">
                ${repositoryCount}
              </text>

              <text
                x="350"
                y="310"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                STARS
              </text>

              <text
                x="350"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="700">
                ${stars}
              </text>

              <text
                x="525"
                y="310"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                FORKS
              </text>

              <text
                x="525"
                y="338"
                text-anchor="middle"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="20"
                font-weight="700">
                ${forks}
              </text>

              <line
                x1="35"
                y1="360"
                x2="665"
                y2="360"
                stroke="#30363d"/>

              <!-- Languages -->

              <text
                x="35"
                y="385"
                fill="#f0f6fc"
                font-family="Arial, sans-serif"
                font-size="15"
                font-weight="700">
                Top Languages
              </text>

              ${languageRows}

              <text
                x="35"
                y="575"
                fill="#6e7681"
                font-family="Arial, sans-serif"
                font-size="10">
                Generated automatically by GitHub Actions
              </text>

            </svg>
            `;

            /*
             * Save SVG into repository
             */

            const path = "assets/github-stats.svg";

            let existingSha;

            try {
              const existing =
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path,
                  ref: context.payload.repository.default_branch
                });

              if (!Array.isArray(existing.data)) {
                existingSha = existing.data.sha;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const encoded =
              Buffer.from(
                svg.trim(),
                "utf8"
              ).toString("base64");

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: update GitHub stats",
              content: encoded,
              sha: existingSha,
              branch:
                context.payload.repository.default_branch
            });

            console.log("GitHub stats updated successfully.");
            console.log({
              totalContributions,
              currentStreak,
              longestStreak,
              commitContributions,
              pullRequests,
              issues,
              reviews,
              repositoryCount,
              stars,
              forks,
              languages
            });
